<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --fluent-brand-1: #1678d4;
            --fluent-brand-2: #5b5fc7;
            --fluent-brand-3: #c239b3;
            --fluent-brand-4: #8f3fd6;
            --fluent-bg-canvas: #f4f4f8;
            --fluent-bg-surface: #ffffff;
            --fluent-bg-soft: #f8f8fc;
            --fluent-text-primary: #1f2937;
            --fluent-text-secondary: #4b5563;
            --fluent-accent: #1678d4;
            --fluent-accent-hover: #125ea8;
            --fluent-neutral-stroke: #d8d7e7;
            --fluent-code-bg: #f3f1ff;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--fluent-text-primary);
            background:
                radial-gradient(1400px 320px at 10% -5%, rgba(22, 120, 212, 0.12) 0%, rgba(22, 120, 212, 0) 52%),
                radial-gradient(1200px 260px at 95% -8%, rgba(143, 63, 214, 0.11) 0%, rgba(143, 63, 214, 0) 58%),
                var(--fluent-bg-canvas);
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 200;
            border-bottom: 3px solid transparent;
            border-image: linear-gradient(90deg, var(--fluent-brand-1), var(--fluent-brand-2), var(--fluent-brand-3)) 1;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 8px 24px rgba(8, 111, 202, 0.08);
            backdrop-filter: blur(8px);
        }

        .topbar-inner {
            width: min(calc(100% - 32px), 1380px);
            min-height: 64px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .viewer-title {
            min-width: 0;
            overflow: hidden;
            color: var(--fluent-text-primary);
            font-size: 16px;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .page-layout {
            width: min(calc(100% - 32px), 1380px);
            margin: 24px auto 48px;
            display: grid;
            grid-template-columns: 250px 8px minmax(0, 1fr);
            gap: 0;
            align-items: start;
        }

        .page-layout.toc-collapsed {
            grid-template-columns: 48px 0 minmax(0, 1fr);
        }

        .toc-panel {
            grid-column: 1;
            min-width: 0;
            position: sticky;
            top: 88px;
            max-height: calc(100vh - 112px);
            overflow: auto;
            background-color: var(--fluent-bg-surface);
            border: 1px solid var(--fluent-neutral-stroke);
            border-radius: 16px;
            box-shadow: 0 10px 28px rgba(28, 55, 96, 0.07);
        }

        .toc-card {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .resizer {
            grid-column: 2;
            position: sticky;
            top: 88px;
            width: 8px;
            height: calc(100vh - 112px);
            border: 0;
            border-right: 1px solid var(--fluent-neutral-stroke);
            background: transparent;
            cursor: col-resize;
            touch-action: none;
        }

        .resizer:hover,
        .resizer:focus-visible,
        .resizer.active {
            border-right-color: var(--fluent-accent);
            background: var(--fluent-bg-soft);
            outline: 0;
        }

        .toc-title {
            width: 100%;
            appearance: none;
            border: 0;
            background: transparent;
            font: inherit;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            color: #1f2937;
            margin: 0;
            padding: 14px 16px;
            border-bottom: 1px solid #e3e8ee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .toc-title::after {
            content: "−";
            font-size: 18px;
            line-height: 1;
            color: #6b7280;
        }

        .toc-card.is-collapsed .toc-title::after {
            content: "+";
        }

        .toc-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-height: 0;
            overflow-y: auto;
            padding: 10px;
        }

        .toc-card.is-collapsed .toc-list {
            display: none;
        }

        .toc-card.is-collapsed {
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
        }

        .page-layout.toc-collapsed .toc-title {
            width: 100%;
            height: auto;
            margin: 0;
            padding: 14px 0;
            border: 0;
            font-size: 0;
            justify-content: center;
        }

        .page-layout.toc-collapsed .toc-title::after {
            font-size: 16px;
        }

        .toc-link {
            color: #374151;
            text-decoration: none;
            line-height: 1.4;
            border-left: 3px solid transparent;
            padding: 6px 0 6px 10px;
            border-radius: 0 8px 8px 0;
            display: block;
        }

        .toc-link:hover {
            color: var(--fluent-accent);
            text-decoration: none;
            background-color: #f7faff;
            border-left-color: #b7d3f2;
        }

        .toc-h2 {
            font-size: 14px;
            font-weight: 400;
            color: #6b7280;
        }

        .toc-h3 {
            font-size: 13px;
            margin-left: 12px;
            font-weight: 400;
            color: #7a8494;
        }

        .toc-empty {
            color: #6b7280;
            font-size: 13px;
        }
        
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 26px 28px;
            background-color: var(--fluent-bg-surface);
            border: 1px solid var(--fluent-neutral-stroke);
            border-radius: 16px;
            box-shadow: 0 12px 34px rgba(73, 84, 162, 0.12);
        }

        .page-main {
            grid-column: 3;
            min-width: 0;
            margin-left: 16px;
            padding: 43px;
            overflow: hidden;
            background-color: var(--fluent-bg-surface);
            border: 1px solid var(--fluent-neutral-stroke);
            border-radius: 16px;
            box-shadow: 0 12px 34px rgba(73, 84, 162, 0.12);
        }

        .is-home .container {
            border: 0;
            border-radius: 0;
            box-shadow: none;
            background: transparent;
            padding: 20px;
        }

        .page-top-actions {
            display: flex;
            justify-content: flex-end;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 10px 0;
            margin-bottom: 12px;
            margin-left: -26px;
            margin-right: -26px;
            padding-left: 26px;
            padding-right: 26px;
            border-bottom: 1px solid var(--fluent-neutral-stroke);
        }

        .home-button {
            display: inline-flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #d4d8ff;
            background-color: #ffffff;
            color: #4044a5;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            line-height: 1;
        }

        .home-button:hover {
            background-color: #edefff;
            color: #3236a3;
            border-color: #bcc1ff;
            text-decoration: none;
        }

        .is-doc .page-main > h1:first-of-type,
        .is-doc .container > h1:first-of-type {
            margin-top: 6px;
            margin-bottom: 22px;
            padding: 16px 18px;
            border-radius: 12px;
            color: #ffffff;
            background:
                linear-gradient(120deg, var(--fluent-brand-1) 0%, var(--fluent-brand-2) 52%, var(--fluent-brand-3) 100%);
            box-shadow: 0 8px 20px rgba(91, 95, 199, 0.28);
        }

        .is-doc h2 {
            scroll-margin-top: 88px;
            margin-top: 30px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e4e2f4;
            color: #2f337f;
        }

        .is-doc .section-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            appearance: none;
            border: 0;
            background: transparent;
            font: inherit;
            color: inherit;
            cursor: pointer;
            text-align: left;
        }

        .is-doc .section-toggle::after {
            content: "−";
            flex: 0 0 auto;
            font-size: 18px;
            line-height: 1;
            color: #6b7280;
        }

        .is-doc .section-toggle.is-collapsed::after {
            content: "+";
        }

        .is-doc .section-body.is-collapsed {
            display: none;
        }

        .is-doc h3 {
            scroll-margin-top: 88px;
            color: #3f468f;
        }

        .is-doc ol,
        .is-doc ul {
            color: #2f3442;
        }

        .is-doc li::marker {
            color: #5b5fc7;
            font-weight: 700;
        }
        
        h1, h2, h3, h4, h5, h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            color: var(--fluent-text-primary);
        }
        
        h1 { font-size: 32px; }
        h2 { font-size: 24px; }
        h3 { font-size: 20px; }
        
        p, ul, ol, blockquote, pre, table, hr {
            margin-bottom: 16px;
        }
        
        ul, ol {
            padding-left: 2em;
        }
        
        li {
            margin-bottom: 8px;
        }
        
        code {
            background-color: var(--fluent-code-bg);
            border-radius: 3px;
            padding: 0.2em 0.4em;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 85%;
            color: var(--fluent-text-primary);
        }
        
        pre {
            background-color: var(--fluent-code-bg);
            border-radius: 6px;
            padding: 16px;
            font-family: "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            border: 1px solid #dfdbff;
            position: relative;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .code-copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            border: 1px solid #c9c4f5;
            background-color: #ffffff;
            color: #37308c;
            border-radius: 6px;
            padding: 4px 9px;
            font-size: 12px;
            line-height: 1.2;
            cursor: pointer;
        }

        .code-copy-btn:hover {
            background-color: #f1eeff;
        }
        
        pre code {
            background-color: transparent;
            padding: 0;
            display: block;
            font-family: "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        
        blockquote {
            border-left: 4px solid #c8c2fa;
            padding-left: 16px;
            color: var(--fluent-text-secondary);
        }

        .is-doc blockquote {
            margin-top: 14px;
            padding: 12px 14px;
            border-left: 4px solid #8f88e8;
            border-radius: 8px;
            background-color: #f5f4ff;
            color: #353a73;
        }

        .is-doc .callout {
            margin: 16px 0;
            border-radius: 10px;
            border-left: 4px solid;
            padding: 14px 16px;
        }

        .is-doc .callout-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .is-doc .callout-title::before {
            display: inline-block;
            margin-right: 8px;
        }

        .is-doc .callout p:last-child,
        .is-doc .callout ul:last-child,
        .is-doc .callout ol:last-child {
            margin-bottom: 0;
        }

        .is-doc .callout-note {
            background-color: #eef3ff;
            border-left-color: #4f6ad7;
            color: #2f3f86;
        }

        .is-doc .callout-note .callout-title {
            color: #2c57c8;
        }

        .is-doc .callout-note .callout-title::before {
            content: "✎";
        }

        .is-doc .callout-important {
            background-color: #eaf4f5;
            border-left-color: #4bb7b5;
            color: #2b4548;
        }

        .is-doc .callout-important .callout-title {
            color: #2d9e9c;
        }

        .is-doc .callout-important .callout-title::before {
            content: "◔";
        }

        hr {
            border: 0;
            border-top: 4px solid #cfd6dd;
            margin: 22px 0 18px;
        }

        .is-doc hr {
            border-top: 0;
            height: 1px;
            margin: 24px 0 20px;
            background: linear-gradient(90deg, rgba(22, 120, 212, 0) 0%, rgba(91, 95, 199, 0.46) 50%, rgba(194, 57, 179, 0) 100%);
        }

        hr + h2 {
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #e3e8ee;
        }

        h2 + hr {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-spacing: 0;
            margin: 16px 0;
            border: 1px solid var(--fluent-neutral-stroke);
        }

        th,
        td {
            border: 1px solid var(--fluent-neutral-stroke);
            padding: 11px 14px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #f1f3ff;
            font-weight: 700;
            color: #31358f;
        }

        tbody tr:nth-child(even) td {
            background-color: #fbfbff;
        }

        tbody tr:nth-child(odd) td {
            background-color: #ffffff;
        }

        /* 이미지 스타일 - 비율 유지하면서 최대 너비 제한 */
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 16px 0;
            border-radius: 6px;
        }

        .is-doc img {
            border: 1px solid #dfdcf5;
            box-shadow: 0 6px 18px rgba(84, 88, 158, 0.14);
            background-color: #ffffff;
        }
        
        a {
            color: var(--fluent-accent);
            text-decoration: none;
        }
        
        a:hover {
            color: var(--fluent-accent-hover);
            text-decoration: underline;
        }

        @media (max-width: 860px) {
            .page-layout {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .page-layout.toc-collapsed {
                grid-template-columns: 1fr;
            }

            .toc-panel {
                grid-column: 1;
                position: static;
                max-height: none;
            }

            .resizer {
                display: none;
            }

            .page-main {
                grid-column: 1;
                margin-left: 0;
            }

            .page-layout.toc-collapsed .toc-title {
                justify-content: space-between;
                padding: 14px 16px;
                font-size: 14px;
            }

            .toc-card.mobile-default .toc-list {
                display: none;
            }

            .toc-card.mobile-default .toc-title::after {
                content: "+";
            }
        }

        @media (max-width: 540px) {
            .topbar-inner,
            .page-layout {
                width: min(calc(100% - 20px), 1380px);
            }

            .page-main {
                padding: 24px 20px 40px;
            }
        }
    </style>
</head>
<body class="{% if page.url == '/' %}is-home{% else %}is-doc{% endif %}{% if page.toc %} has-toc{% endif %}">
    {% if page.toc %}
    <header class="topbar">
        <div class="topbar-inner">
            <div class="viewer-title" id="viewer-title">실습 문서</div>
            <a class="home-button" href="{{ '/' | relative_url }}">← 홈으로 가기</a>
        </div>
    </header>
    <div class="page-layout" id="page-layout">
        <aside class="toc-panel" aria-label="목차">
            <div class="toc-card mobile-default" id="toc-card">
                <button class="toc-title" id="toc-toggle" type="button" aria-expanded="false" aria-controls="page-toc">목차</button>
                <nav class="toc-list" id="page-toc">
                    <div class="toc-empty">섹션을 불러오는 중...</div>
                </nav>
            </div>
        </aside>
        <div class="resizer" id="resizer" role="separator" aria-label="목차 너비 조절" aria-orientation="vertical" aria-valuemin="200" aria-valuemax="520" aria-valuenow="250" tabindex="0"></div>
        <main class="page-main" id="page-content">
            {{ content }}
        </main>
    </div>
    {% else %}
    <div class="container">
        {% if page.url != '/' %}
        <div class="page-top-actions">
            <a class="home-button" href="{{ '/' | relative_url }}">홈으로 가기</a>
        </div>
        {% endif %}
        {{ content }}
    </div>
    {% endif %}
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const calloutMap = {
                NOTE: { cls: 'callout-note', title: 'Note' },
                IMPORTANT: { cls: 'callout-important', title: 'Important' }
            };

            const copyText = function (text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(text);
                }

                return new Promise(function (resolve, reject) {
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    textArea.style.position = 'fixed';
                    textArea.style.opacity = '0';
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();

                    try {
                        const success = document.execCommand('copy');
                        document.body.removeChild(textArea);
                        if (success) {
                            resolve();
                        } else {
                            reject(new Error('Copy command failed'));
                        }
                    } catch (err) {
                        document.body.removeChild(textArea);
                        reject(err);
                    }
                });
            };

            const codeBlocks = Array.from(document.querySelectorAll('pre > code'));
            codeBlocks.forEach(function (codeBlock) {
                const pre = codeBlock.parentElement;
                if (!pre || pre.querySelector('.code-copy-btn')) return;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'code-copy-btn';
                btn.textContent = '복사';

                btn.addEventListener('click', function () {
                    const originalLabel = btn.textContent;
                    copyText(codeBlock.innerText)
                        .then(function () {
                            btn.textContent = '복사됨';
                            setTimeout(function () {
                                btn.textContent = originalLabel;
                            }, 1200);
                        })
                        .catch(function () {
                            btn.textContent = '실패';
                            setTimeout(function () {
                                btn.textContent = originalLabel;
                            }, 1200);
                        });
                });

                pre.appendChild(btn);
            });

            const blockquotes = Array.from(document.querySelectorAll('.is-doc blockquote'));
            blockquotes.forEach(function (quote) {
                const firstParagraph = quote.querySelector('p');
                if (!firstParagraph) return;

                const raw = (firstParagraph.textContent || '').trim();
                const match = raw.match(/^\[!(NOTE|IMPORTANT)\]\s*/i);
                if (!match) return;

                const token = match[1].toUpperCase();
                const config = calloutMap[token];
                if (!config) return;

                const bodyText = raw.replace(/^\[!(NOTE|IMPORTANT)\]\s*/i, '').trim();
                firstParagraph.textContent = bodyText;
                if (!firstParagraph.textContent) {
                    firstParagraph.remove();
                }

                quote.classList.add('callout', config.cls);
                const title = document.createElement('div');
                title.className = 'callout-title';
                title.textContent = config.title;
                quote.insertBefore(title, quote.firstChild);
            });

            const content = document.getElementById('page-content');
            const toc = document.getElementById('page-toc');
            const tocCard = document.getElementById('toc-card');
            const tocToggle = document.getElementById('toc-toggle');
            const pageLayout = document.getElementById('page-layout');
            const resizer = document.getElementById('resizer');
            const viewerTitle = document.getElementById('viewer-title');
            if (!content || !toc || !tocCard || !tocToggle || !pageLayout || !resizer) return;

            const documentHeading = content.querySelector('h1');
            if (documentHeading && viewerTitle) {
                viewerTitle.textContent = documentHeading.textContent || '실습 문서';
            }

            const setTocWidth = function (width) {
                const boundedWidth = Math.min(520, Math.max(200, width));
                pageLayout.style.gridTemplateColumns = `${boundedWidth}px 8px minmax(0, 1fr)`;
                resizer.setAttribute('aria-valuenow', String(Math.round(boundedWidth)));
            };

            let resizing = false;
            resizer.addEventListener('pointerdown', function (event) {
                if (pageLayout.classList.contains('toc-collapsed')) return;
                resizing = true;
                resizer.classList.add('active');
                resizer.setPointerCapture(event.pointerId);
            });

            resizer.addEventListener('pointermove', function (event) {
                if (!resizing) return;
                const layoutLeft = pageLayout.getBoundingClientRect().left;
                setTocWidth(event.clientX - layoutLeft);
            });

            resizer.addEventListener('pointerup', function (event) {
                resizing = false;
                resizer.classList.remove('active');
                if (resizer.hasPointerCapture(event.pointerId)) {
                    resizer.releasePointerCapture(event.pointerId);
                }
            });

            resizer.addEventListener('keydown', function (event) {
                if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
                event.preventDefault();
                const currentWidth = Number(resizer.getAttribute('aria-valuenow'));
                setTocWidth(currentWidth + (event.key === 'ArrowRight' ? 16 : -16));
            });

            tocToggle.addEventListener('click', function () {
                const wasMobileDefault = tocCard.classList.contains('mobile-default');
                tocCard.classList.remove('mobile-default');
                const isCollapsed = wasMobileDefault
                    ? false
                    : tocCard.classList.toggle('is-collapsed');
                if (wasMobileDefault) {
                    tocCard.classList.remove('is-collapsed');
                }
                pageLayout.classList.toggle('toc-collapsed', isCollapsed);
                if (!isCollapsed) {
                    pageLayout.style.removeProperty('grid-template-columns');
                    resizer.setAttribute('aria-valuenow', '250');
                }
                tocToggle.setAttribute('aria-expanded', String(!isCollapsed));
            });

            const headings = Array.from(content.querySelectorAll('h2, h3'));
            toc.innerHTML = '';

            if (!headings.length) {
                const empty = document.createElement('div');
                empty.className = 'toc-empty';
                empty.textContent = '표시할 섹션이 없습니다.';
                toc.appendChild(empty);
                return;
            }

            const slugCounts = {};
            const slugify = function (text) {
                return text
                    .toLowerCase()
                    .trim()
                    .replace(/[^\w\u3131-\uD79D\s-]/g, '')
                    .replace(/\s+/g, '-')
                    .replace(/-+/g, '-');
            };

            const makeId = function (text) {
                let base = slugify(text) || 'section';
                slugCounts[base] = (slugCounts[base] || 0) + 1;
                return slugCounts[base] === 1 ? base : `${base}-${slugCounts[base]}`;
            };

            headings.forEach(function (heading) {
                if (!heading.id) {
                    heading.id = makeId(heading.textContent || 'section');
                }

                const link = document.createElement('a');
                if (heading.tagName === 'H1') {
                    link.className = 'toc-link toc-h2';
                } else if (heading.tagName === 'H3') {
                    link.className = 'toc-link toc-h3';
                } else {
                    link.className = 'toc-link toc-h2';
                }
                link.href = `#${heading.id}`;
                link.textContent = heading.textContent || '';
                toc.appendChild(link);
            });

            const sectionHeadings = Array.from(content.querySelectorAll('h2'));
            sectionHeadings.forEach(function (heading) {
                if (heading.dataset.sectionToggleReady === 'true') return;
                heading.dataset.sectionToggleReady = 'true';

                const body = document.createElement('div');
                body.className = 'section-body';

                let sibling = heading.nextElementSibling;
                while (sibling && sibling.tagName !== 'H2') {
                    const nextSibling = sibling.nextElementSibling;
                    body.appendChild(sibling);
                    sibling = nextSibling;
                }

                heading.insertAdjacentElement('afterend', body);

                const toggle = document.createElement('button');
                toggle.type = 'button';
                toggle.className = 'section-toggle';
                toggle.setAttribute('aria-expanded', 'true');
                toggle.textContent = heading.textContent || '';

                const headingText = heading.textContent || '';
                heading.textContent = '';
                heading.appendChild(toggle);

                if (!heading.id) {
                    heading.id = makeId(headingText || 'section');
                }

                body.id = `${heading.id}-body`;
                toggle.setAttribute('aria-controls', body.id);

                toggle.addEventListener('click', function () {
                    const isCollapsed = body.classList.toggle('is-collapsed');
                    toggle.classList.toggle('is-collapsed', isCollapsed);
                    toggle.setAttribute('aria-expanded', String(!isCollapsed));
                });
            });
        });
    </script>
</body>
</html>
